<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="frame.css" />
  <!-- Generated by scripts/gen-screenshots.js from src/webview/formatEditor/styles.ts -->
  <link rel="stylesheet" href="editor.generated.css" />
  <title>Format editor mockup</title>
</head>
<body>
  <div id="app"></div>
  <script>
    const app = document.getElementById('app');
    const hex = (n) => '0x' + n.toString(16).toUpperCase().padStart(4, '0');

    const tb = (t, on) => `<button class="icon secondary fe-toggle-btn${on ? ' fe-toggle-on' : ''}">${t}</button>`;
    const toggles = (kind, name) => (kind === 'field' ? tb('rsv', false) + tb('{}', false) + tb('b', name === 'flags') : '') + tb('[]', kind === 'array');
    const node = (kind, depth, name, type, offset, size, extra = '') => `
      <div class="fe-node fe-node-${kind}" style="margin-left:${depth * 18}px">
        <div class="fe-node-head">
          <span class="fe-toggle${kind === 'struct' ? '' : ' fe-toggle-empty'}">${kind === 'struct' ? '▼' : ''}</span>
          ${kind === 'array' ? '<span class="fe-badge">ARRAY</span>' : ''}
          <input type="text" value="${name}" style="width:150px" />
          ${kind === 'array' ? `<span class="fe-inline-field"><label class="fe-inline-label">count</label><input type="text" value="8" style="width:90px" /></span><span class="fe-inline-label">of</span>` : ''}
          <input type="text" class="fe-type-combo" value="${type}" style="width:140px" />
          <span class="fe-inline-field"><label class="fe-inline-label">offset</label><input type="text" placeholder="auto" value="${offset}" style="width:70px" /></span>
          <span class="fe-inline-field"><label class="fe-inline-label">size</label><input type="text" value="${size}" style="width:60px" /></span>
          <span class="fe-node-actions">${toggles(kind, name)}<button class="icon secondary">↑</button><button class="icon secondary">↓</button><button class="icon secondary">⧉</button><button class="icon secondary">✕</button></span>
        </div>
        ${extra}
      </div>`;

    const layout = [
      [0, 0, 'magic', 'uint32', 4, ''], [4, 0, 'version', 'uint16', 2, ''], [6, 0, 'flags', 'uint16', 2, ''],
      [8, 0, 'pos', 'Vec3', 12, 'c'], [8, 1, 'x', 'float32', 4, ''], [12, 1, 'y', 'float32', 4, ''], [16, 1, 'z', 'float32', 4, ''],
      [20, 0, 'samples', 'float32[8]', 32, ''],
    ];
    const layoutRows = layout.map(([o, d, n, t, s, c]) => `
      <tr class="${c ? 'fe-lay-container' : ''}"><td>${hex(o)}</td>
      <td>${'\u00a0\u00a0'.repeat(d)}${n}</td><td class="fe-lay-dim">${t}</td><td class="num">${s}</td></tr>`).join('');

    app.innerHTML = `
      <div class="fe-topbar">
        <div class="fe-actions" style="position:static;padding:0">
          <button class="secondary" disabled>↶ Undo</button><button class="secondary">↷ Redo</button>
          <button>Save</button><button class="secondary">Save draft</button>
          <button class="secondary">Validate</button><button class="secondary">Close</button>
        </div>
        <div class="fe-errors fe-errors-ok"><span class="fe-ok">Valid</span></div>
      </div>
      <div class="fe-shell">
        <div class="fe-wrap">
          <h1>Edit Binary Format</h1>
          <div class="fe-file-row"><span class="fe-inline-label">File:</span><span class="fe-mono">C:/Users/me/formats/sensor-frame.json</span>
            <button class="secondary icon-text">↻ Refresh</button><button class="secondary icon-text">Change file…</button></div>
          <div class="fe-tabs"><button class="fe-tab active">Form</button><button class="fe-tab">JSON</button><button class="fe-tab">JSON Preview</button>
            <span class="fe-spacer"></span><button class="secondary">Open JSON file…</button></div>
          <h2>Format</h2>
          <div class="fe-row">
            <div class="fe-field"><label>Name</label><input type="text" value="SensorFrame" style="width:260px" /></div>
            <div class="fe-field"><label>Version</label><input type="text" value="1.0" style="width:90px" /></div>
            <div class="fe-field"><label>Default Endianness</label><select><option>Little Endian</option></select></div>
            <div class="fe-field"><label>File Extensions (comma-separated)</label><input type="text" value=".frm" style="width:200px" /></div>
          </div>
          <h2>Reusable structures</h2>
          <div class="fe-tree">
            <div class="fe-node fe-node-structdef"><div class="fe-node-head"><span class="fe-toggle">▼</span><span class="fe-badge">DEF</span>
              <input type="text" value="Vec3" style="width:180px" /></div></div>
          </div>
          <h2>Fields</h2>
          <div class="fe-tree">
            ${node('field', 0, 'magic', 'uint32', '', '')}
            ${node('field', 0, 'version', 'uint16', '', '')}
            ${node('field', 0, 'flags', 'uint16', '', '')}
            ${node('field', 0, 'pos', 'Vec3', '', '')}
            ${node('array', 0, 'samples', 'float32', '', '')}
          </div>
        </div>
        <aside class="fe-side">
          <h2>Layout Preview</h2>
          <div class="fe-layout">
            <table><thead><tr><th>Offset</th><th>Name</th><th>Type</th><th>Size</th></tr></thead><tbody>${layoutRows}</tbody></table>
            <h3 class="fe-lay-h3">Struct sizes</h3>
            <table><thead><tr><th>Struct</th><th>Size</th><th>Align</th></tr></thead><tbody><tr><td>Vec3</td><td class="num">12</td><td class="num">—</td></tr></tbody></table>
            <div class="fe-layout-foot">Total: 52 bytes (0x0034)</div>
          </div>
        </aside>
      </div>`;
  </script>
</body>
</html>
